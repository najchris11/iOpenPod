name: Ratings CI comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Focused / ${{ matrix.version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: base
            os: windows-2022
            ref: 8bb337f1625a655b5b1662ae610b4d9ee967327b
          - version: base
            os: macos-15
            ref: 8bb337f1625a655b5b1662ae610b4d9ee967327b
          - version: base
            os: macos-15-intel
            ref: 8bb337f1625a655b5b1662ae610b4d9ee967327b
          - version: base
            os: ubuntu-24.04
            ref: 8bb337f1625a655b5b1662ae610b4d9ee967327b
          - version: pr
            os: windows-2022
            ref: 944543ed67f66f85c40dd43b0effbb20436f6ce9
          - version: pr
            os: macos-15
            ref: 944543ed67f66f85c40dd43b0effbb20436f6ce9
          - version: pr
            os: macos-15-intel
            ref: 944543ed67f66f85c40dd43b0effbb20436f6ce9
          - version: pr
            os: ubuntu-24.04
            ref: 944543ed67f66f85c40dd43b0effbb20436f6ce9
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libpulse0 libasound2t64 udev btrfs-progs

      - name: Install Windows media tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Install macOS media tools
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi

      - name: Verify media tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install project and dev dependencies
        if: runner.os != 'macOS'
        run: uv sync --locked --managed-python --group packaging

      - name: Install macOS environment for the declared deployment target
        if: runner.os == 'macOS'
        run: uv run --no-project --managed-python --python 3.12 python scripts/sync_macos_build.py --with-checks

      - name: Compare affected tests and the reported Storage failure
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          candidates = ['tests/iOpenPod/app/test_media_rating_tags.py', 'tests/iOpenPod/app/test_host_media_library.py', 'tests/iOpenPod/app/test_host_media_network.py', 'tests/iOpenPod/app/test_rating_back_sync.py', 'tests/iOpenPod/app/test_export_tagging.py', 'tests/storage/test_host_replacement.py', 'tests/iOpenPod/app/test_sync_execution.py', 'tests/iOpenPod/app/test_sync_updates.py', 'tests/iOpenPod/GUI/test_sync_settings.py', 'tests/storage/test_session.py::test_range_snapshots_expose_a_lightweight_identity_for_safe_caching']
          present = [p for p in candidates if Path(p.split("::", 1)[0]).is_file()]
          print("Selected:", present, flush=True)
          print("PR-new files absent from this revision:", sorted(set(candidates) - set(present)), flush=True)
          result = subprocess.run(["uv", "run", "--no-sync", "pytest", "-n8", "-vv", "--tb=short", "--junitxml=results/focused.xml", *present], check=False)
          sys.exit(result.returncode)
          PY
      - name: Retain test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: focused-${{ matrix.version }}-${{ matrix.os }}
          path: results/focused.xml
          if-no-files-found: warn

